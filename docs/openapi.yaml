openapi: 3.1.0
info:
  title: SubmissionLedger API
  version: 0.3.0
  description: Local submission intake and durable named webhook delivery.
servers:
  - url: http://127.0.0.1:8787
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        requestId: { type: string }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
    Intake:
      type: object
      additionalProperties: false
      required: [payload]
      properties:
        source: { type: string, default: api }
        payload: { type: object }
        destinations:
          type: array
          maxItems: 8
          uniqueItems: true
          items: { type: string }
    Queue:
      type: object
      additionalProperties: false
      required: [destination]
      properties:
        destination: { type: string }
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Process health
      security: []
      responses:
        '200': { description: Service running }
  /v1/submissions:
    post:
      summary: Accept a submission and optionally queue webhooks atomically
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Intake' }
      responses:
        '201': { description: New submission }
        '200': { description: Idempotent replay }
        '409': { description: Idempotency conflict }
        '422': { description: Invalid input or destination }
    get:
      summary: List recent submissions without payloads
      parameters:
        - in: query
          name: source
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, maximum: 10000 }
      responses:
        '200': { description: Paged submission summaries }
  /v1/submissions/{id}:
    get:
      summary: Retrieve full submission
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Submission detail }
        '404': { description: Not found }
  /v1/submissions/{id}/deliveries:
    post:
      summary: Queue one configured webhook for an existing submission
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Queue' }
      responses:
        '201': { description: New delivery job }
        '200': { description: Existing delivery job }
        '404': { description: Submission not found }
        '422': { description: Unconfigured destination }
  /v1/deliveries:
    get:
      summary: List deliveries without payloads
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, leased, retry, delivered, dead] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, maximum: 10000 }
      responses:
        '200': { description: Paged delivery statuses }
  /v1/deliveries/stats:
    get:
      summary: Delivery counts by status
      responses:
        '200': { description: Status counts }
  /v1/deliveries/{id}:
    get:
      summary: Delivery and attempt history
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Delivery with attempts }
        '404': { description: Not found }
  /v1/stats:
    get:
      summary: Intake statistics
      responses:
        '200': { description: Counters by source }
  /v1/ledger/verify:
    get:
      summary: Verify the acceptance event chain
      responses:
        '200': { description: Integrity report (does not include outbox) }
